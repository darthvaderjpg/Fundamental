<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #320e13 !important;
            color: #ffffff !important;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }


        .terminal-frame {
            width: 100%;
            max-width: 80ch;
            background-color: #050505;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            text-align: left;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #888888;
            font-size: 0.85rem;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .terminal-header button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 2px 6px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .terminal-header button:hover {
            background: rgba(0, 255, 102, 0.15) !important;
        }

        button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 6px 12px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        button:hover {
            background: rgba(0, 255, 102, 0.1) !important;
        }

        input[type="text"] {
            background: #111;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 1rem;
            border-radius: 4px;
            width: 70%;
            max-width: 300px;
        }

        a {
            color: #00ff66 !important;
            text-decoration: underline;
        }
        a:hover {
            color: #ffffff !important;
        }

        .terminal-footer {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 20px;
            color: #666666;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <div class="terminal-frame">
        <div>
  
            <div class="terminal-header">
                <span>Vers: 1.0 Res:(80x24)</span>
                <span id="session-status">TRANSLATOR</span>
                <div class="header-controls">
                    <button onclick="window.open('translator.html', 'TranslatorSuite', 'width=850,height=650,resizable=yes')" title="Pop out terminal window">[🗗] New Window</button>
                </div>
            </div>

            <div class="container" style="text-align: center;">
                <h1>Binary Translator</h1>
                <p id="player-greeting" style="color: #00ff66;"></p>
                <p>> Translate the following binary into regular text:</p>

                <h2 id="binary" style="color: #ffffff; letter-spacing: 2px; margin: 20px 0;">Loading...</h2><br>
                
                <div style="margin-bottom: 15px;">
                    <input type="text" id="translation" placeholder="Your Answer: ex. dog">
                    <button id="guess" style="margin-left: 8px;">Submit Answer</button>
                </div>

                <p id="result" style="margin-top: 15px; font-weight: bold; min-height: 1.2rem;"></p>
                <p style="font-size: 1rem;">Score: <span id="score" style="color: #00ff66; font-weight: bold;">0</span></p>

                <br>
                <a href="index.html" class="back-button">Return to Menu</a>
            </div>
        </div>

        <div class="terminal-footer">
            <span>Created by: Cookie Bandit</span>
        </div>
    </div>

    <script src="translator.js"></script>
</body>
</html>

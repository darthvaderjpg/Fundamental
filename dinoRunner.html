<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Runner</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, .container, .minigames {
            background-color: #320e13 !important;
            color: #ffffff;
            font-family: monospace;
            text-align: center;
        }
        
        button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 8px 16px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:hover {
            background: rgba(0,255,102, 0.1) !important;
        }

        canvas {
            background-color: #050505;
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            display: block;
            margin: 20px auto;
        }

        a {
            color: #ffffff !important;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dino Run</h1>
        <p id="player-greeting" style="font-weight: bold; color: #efefef;"></p>
        
        <p style="font-size: 1.1rem;">High Score: <span id="high-score" style="color: #ffff33; font-weight: bold;">0</span> | Score: <span id="current-score" style="color: #00ff66; font-weight: bold;">0</span></p>
        
        <hr style="border-color: #333; margin: 20px 0;">

        <canvas id="dinoCanvas" width="600" height="200"></canvas>
        <p id="game-message" style="color: #ffffff; font-weight: bold; min-height: 1.5rem;">Press [SPACE] or [UP ARROW] to Jump/Start</p>
      
        <div>
            <button id="start-btn">Start Run</button>
        </div>

        <div style="margin-top: 25px; max-width: 600px; margin-left: auto; margin-right: auto;">
            <h3 style="font-size: 0.9rem; color: #888; margin-bottom: 5px; text-align: left;">// SYSTEM_LOG_</h3>
            <div id="game-log" style="background: #050505; border: 1px solid #333; padding: 10px; height: 90px; overflow-y: auto; font-size: 0.85rem; color: #00ff66; font-family: monospace; text-align: left;">
                <div style="color: #666;">[SYSTEM] DINOSAUR RUN IS LOADED</div>
                <div style="color: #666;">[SYSTEM] STANDBY FOR PLAYER INPUT</div>
            </div>
        </div>
   
        <br><br>
        <a href="index.html" class="back-button">Menu</a>
    </div>

    <script src="dinoRunner.js"></script>
</body>
</html>

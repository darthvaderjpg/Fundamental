<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #320e13 !important;
            color: #ffffff !important;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

       
        .terminal-frame {
            width: 100%;
            max-width: 80ch;
            background-color: #050505;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            text-align: left;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #888888;
            font-size: 0.85rem;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .terminal-header button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 2px 6px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .terminal-header button:hover {
            background: rgba(0, 255, 102, 0.15) !important;
        }

        button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 6px 12px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        button:hover {
            background: rgba(255,255,255,.1) !important;
        }

        #reset-btn {
            color: #00ff66 !important;
            border-color: #00ff66 !important;
        }

        .ttt-grid {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 6px;
            margin: 15px auto;
            justify-content: center;
        }

        .ttt-cell {
            background-color: #050505;
            border: 1px solid #ffffff;
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
            user-select: none;
        }
        .ttt-cell:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 10px rgba(0,255,102,0.6);
        }

        .player-mark {
            color: #00ff66 !important;
            border-color: #00ff66 !important;
            box-shadow: 0 0 8px rgba(0,255,102, 0.25);
        }

        .cpu-mark {
            color: #ffffff !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 8px rgba(255,255,255, 0.25);
        }

        a {
            color: #00ff66 !important;
            text-decoration: underline;
        }
        a:hover {
            color: #ffffff !important;
        }

        .terminal-footer {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 20px;
            color: #666666;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="terminal-frame">
        <div>
          
            <div class="terminal-header">
                <span>Vers: 1.0 Res:(80x24)</span>
                <span id="session-status">TIC-TAC-TOE</span>
                <div class="header-controls">
                    <button onclick="window.open('ticTacToe.html', 'TicTacToeSuite', 'width=850,height=650,resizable=yes')" title="Pop out terminal window">[🗗] New Window</button>
                </div>
            </div>

            <div class="container" style="text-align: center;">
                <h1>Tic Tac Toe</h1>
                <p id="player-greeting" style="color: #00ff66;"></p>
                
                <div style="margin-bottom: 12px;">
                    <label>Choose Your Symbol: </label>
                    <select id="symbol-select" style="background: #050505; color: #00ff66; border: 1px solid #00ff66; padding: 4px; font-family: monospace;">
                        <option value="X">X</option>
                        <option value="O">O</option>
                    </select>
                </div>

                <p style="font-size: 1rem;">Score - Player: <span id="player-score" style="color: #00ff66; font-weight: bold;">0</span> | CPU Jimmothy: <span id="cpu-score" style="color: #ffffff; font-weight: bold;">0</span></p>
                <hr style="border-color: #333; margin: 15px 0;">

                <p id="game-message" style="color: #ffffff; font-weight: bold; min-height: 1.2rem; font-size: 0.9rem;">[SYSTEM] Turn: Player</p>
                
                <div class="ttt-grid" id="ttt-grid">
                    <div class="ttt-cell" data-index="0"></div>
                    <div class="ttt-cell" data-index="1"></div>
                    <div class="ttt-cell" data-index="2"></div>
                    <div class="ttt-cell" data-index="3"></div>
                    <div class="ttt-cell" data-index="4"></div>
                    <div class="ttt-cell" data-index="5"></div>
                    <div class="ttt-cell" data-index="6"></div>
                    <div class="ttt-cell" data-index="7"></div>
                    <div class="ttt-cell" data-index="8"></div>
                </div>

                <div>
                    <button id="reset-btn">Reset Board</button>
                </div>

                <div style="margin-top: 20px; max-width: 360px; margin-left: auto; margin-right: auto; text-align: left;">
                    <h3 style="font-size: 0.85rem; color: #888; margin-bottom: 4px;">// SYSTEM_LOG_</h3>
                    <div id="combat-log" style="background: #050505; border: 1px solid #333; padding: 8px; height: 80px; overflow-y: auto; font-size: 0.8rem; color: #00ff66; font-family: monospace;">
                        <div style="color: #666;">[SYSTEM] TIC TAC TOE INITIALIZED</div>
                        <div style="color: #666;">[SYSTEM] STANDBY FOR PLAYER INPUT</div>
                    </div>
                </div>
                
                <br>
                <a href="index.html" class="back-button">Return to Menu</a>
            </div>
        </div>

    
        <div class="terminal-footer">
            <span>Created by: Cookie Bandit</span>
        </div>
    </div>

    <script src="ticTacToe.js"></script>
</body>
</html>

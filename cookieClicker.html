<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #320e13 !important;
            color: #ffffff !important;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

 
        .terminal-frame {
            width: 100%;
            max-width: 80ch; 
            background-color: #050505;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            text-align: left;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #888888;
            font-size: 0.85rem;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .terminal-header button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 2px 6px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .terminal-header button:hover {
            background: rgba(0, 255, 102, 0.15) !important;
        }

        button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 6px 10px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        button:hover {
            background: rgba(0, 255, 102, 0.1) !important;
        }

        #save-btn {
            color: #00ff66 !important;
            border-color: #00ff66 !important;
        }
        #save-btn:hover {
            background: rgba(0, 255, 102, 0.1) !important;
        }

        #reset-btn {
            color: #ff3333 !important;
            border-color: #ff3333 !important;
        }
        #reset-btn:hover {
            background: rgba(255, 51, 51, 0.15) !important;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin: 8px 0;
        }


        a {
            color: #00ff66 !important;
            text-decoration: underline;
        }
        a:hover {
            color: #000000 !important;
        }

        .terminal-footer {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 20px;
            color: #666666;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="terminal-frame">
        <div>

            <div class="terminal-header">
                <span>Vers: 1.0 Res:(80x24)</span>
                <span id="session-status">COOKIE CLICKER</span>
                <div class="header-controls">
                    <button onclick="window.open('cookieClicker.html', 'CookieClicker', 'width=850,height=650,resizable=yes')" title="Pop out terminal window">[🗗] New Window</button>
                </div>
            </div>

            <div class="container">
                <h1>Cookie Clicker</h1>
                <p id="player-greeting" style="color: #00ff66;"></p>

                <p style="font-size: 1.1rem;">Cookies: <span id="cookie-count" style="font-weight: bold; color: #00ff66;">0</span> | Per Second (CPS): <span id="cps-count" style="color: #ffff33;">0</span></p>

                <div style="text-align: center; margin: 15px 0;">
                    <pre id="click-btn" style="cursor: pointer; display: inline-block; text-align: left; border: 2px solid #00ff66; background-color: #050505; padding: 12px 20px; color: #00ff66; font-family: monospace; user-select: none; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2); font-size: 0.85rem;">
  .-------.
 /  *   .  \
| .    .  *|   <-- [ CLICK TO MINE ]
 \  .    * /
  '-------'</pre>
                </div>

                <hr style="border-color: #333; margin: 15px 0;">

                <h2>Upgrades</h2>
                <div class="minigames">
                    <ul>
                        <li><button id="upgrade1">Buy Auto Clicker (+1 CPS) (Cost: <span id="cursor-cost">15</span>) | Owned: <span id="cursor-count">0</span></button></li>
                        <li><button id="upgrade2">Buy Temu Clicker (+4 CPS) (Cost: <span id="temu-cost">50</span>) | Owned: <span id="temu-count">0</span></button></li>
                        <li><button id="upgrade3">Buy Grandma's Clicker (+12 CPS) (Cost: <span id="grandma-cost">120</span>) | Owned: <span id="grandma-count">0</span></button></li>
                        <li><button id="upgrade4">Buy Factory Clicker (+35 CPS) (Cost: <span id="factory-cost">300</span>) | Owned: <span id="factory-count">0</span></button></li>
                    </ul>
                    <br>
                    <div>
                        <button id="save-btn">Save Game</button>
                        <button id="reset-btn" style="margin-left: 10px;">Reset Progress</button>
                    </div>
                    <br>
                    <a href="index.html" class="back-button">Return to Menu</a>
                </div>
            </div>
        </div>


        <div class="terminal-footer">
            <span>Created by: Cookie Bandit</span>
        </div>
    </div>

    <script src="cookieClicker.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Clicker</title>
    <link rel="stylesheet" href="style.css">
    <style>
      
        body, .container, .minigames {
            background-color: #320e13 !important;
            color: #ffffff !important;
            font-family: monospace;
        }


        button {
            background: transparent !important;
            border: none !important;
            color: #ffffff !important;
            padding: 8px 12px;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.1) !important;
        }

       
        #save-btn {
            color: #00ff66 !important;
        }
        #save-btn:hover {
            background: rgba(0, 255, 102, 0.1) !important;
        }

        #reset-btn {
            color: #ff3333 !important;
        }
        #reset-btn:hover {
            background: rgba(255, 51, 51, 0.1) !important;
        }

        /* Links */
        a {
            color: #ffffff !important;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Terminal Cookie Clicker</h1>
        <p id="player-greeting"></p>

        <p style="font-size: 1.3rem;">Cookies: <span id="cookie-count" style="font-weight: bold;">0</span></p>
        <p style="font-size: 0.9rem;">Per Second (CPS): <span id="cps-count">0</span></p>

        <!-- Terminal ASCII Cookie Button (Fixed Alignment) -->
        <div style="text-align: center; margin: 15px 0;">
            <pre id="click-btn" style="cursor: pointer; display: inline-block; text-align: left; border: 2px solid #00ff66; background-color: #050505; padding: 15px 25px; color: #00ff66; font-family: monospace; user-select: none; box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);">
  .-------.
 /  *   .  \
| .    .  *|   <-- [ CLICK TO MINE ]
 \  .    * /
  '-------'</pre>
        </div>
        <br>
    </div>

    <div class="container" style="margin-top: -20px;">
        <h2>Upgrades</h2>
        <div class="minigames">
            <ul>
                <li><button id="upgrade1">Buy Auto Clicker (+1 CPS) (Cost: <span id="cursor-cost">15</span>) | Owned: <span id="cursor-count">0</span></button></li>
                <li><button id="upgrade2">Buy Temu Clicker (+4 CPS) (Cost: <span id="temu-cost">50</span>) | Owned: <span id="temu-count">0</span></button></li>
                <li><button id="upgrade3">Buy Grandma's Clicker (+12 CPS) (Cost: <span id="grandma-cost">120</span>) | Owned: <span id="grandma-count">0</span></button></li>
                <li><button id="upgrade4">Buy Factory Clicker (+35 CPS) (Cost: <span id="factory-cost">300</span>) | Owned: <span id="factory-count">0</span></button></li>
            </ul>
            <br>
            <button id="save-btn">Save Game</button>
            <button id="reset-btn" style="margin-left: 10px;">Reset Progress</button>
            <br><br>
            <a href="index.html" class="back-button">More Games</a>
        </div>
    </div>

    <script src="cookieClicker.js"></script>
</body>
</html>

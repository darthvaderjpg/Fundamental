<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #320e13 !important;
            color: #ffffff !important;
            font-family: monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .terminal-frame {
            width: 100%;
            max-width: 80ch; 
            background-color: #050505;
            border: 2px solid #ffffff;
            border-radius: 6px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
            text-align: left;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #888888;
            font-size: 0.85rem;
        }

        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .terminal-header button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 2px 6px;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }

        .terminal-header button:hover {
            background: rgba(0, 255, 102, 0.15) !important;
        }

        button {
            background: transparent !important;
            border: 1px solid #00ff66 !important;
            color: #00ff66 !important;
            padding: 6px 12px;
            font-family: inherit;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        
        button:hover {
            background: rgba(0,255,102, 0.1) !important;
        }

        canvas {
            background-color: #050505;
            border: 2px solid #00ff66;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
            display: block;
            margin: 15px auto;
            max-width: 100%;
        }

        a {
            color: #00ff66 !important;
            text-decoration: underline;
        }
        a:hover {
            color: #ffffff !important;
        }

        .terminal-footer {
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 20px;
            color: #666666;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="terminal-frame">
        <div>
         
            <div class="terminal-header">
                <span>Vers: 1.0 Res:(80x24)</span>
                <span id="session-status">FLAPPY BIRD</span>
                <div class="header-controls">
                    <button onclick="window.open('flappyBird.html', 'FlappySuite', 'width=850,height=650,resizable=yes')" title="Pop out terminal window">[🗗] New Window</button>
                </div>
            </div>

            <div class="container" style="text-align: center;">
                <h1>Flappy Bird</h1>
                <p id="player-greeting" style="font-weight: bold; color: #00ff66;"></p>
                
                <p style="font-size: 1rem;">High Score: <span id="high-score" style="color: #ffff33; font-weight: bold;">0</span> | Score: <span id="current-score" style="color: #00ff66; font-weight: bold;">0</span></p>
                
                <hr style="border-color: #333; margin: 15px 0;">

                <canvas id="flappyCanvas" width="380" height="420"></canvas>
                <p id="game-message" style="color: #ffffff; font-weight: bold; min-height: 1.2rem; font-size: 0.9rem;">Press [SPACE] or [CLICK] to fly</p>
              
                <div>
                    <button id="start-btn">Start Flight</button>
                </div>

                <div style="margin-top: 20px; max-width: 380px; margin-left: auto; margin-right: auto; text-align: left;">
                    <h3 style="font-size: 0.85rem; color: #888; margin-bottom: 4px;">// SYSTEM_LOG_</h3>
                    <div id="game-log" style="background: #050505; border: 1px solid #333; padding: 8px; height: 80px; overflow-y: auto; font-size: 0.8rem; color: #00ff66; font-family: monospace;">
                        <div style="color: #666;">[SYSTEM] FLAPPY BIRD INITIALIZED</div>
                        <div style="color: #666;">[SYSTEM] STANDBY FOR NEXT FLIGHT</div>
                    </div>
                </div>
           
                <br>
                <a href="index.html" class="back-button"> Return to Menu</a>
            </div>
        </div>

  
        <div class="terminal-footer">
            <span>Created by: Cookie Bandit</span>
        </div>
    </div>

    <script src="flappyBird.js"></script>
</body>
</html>
